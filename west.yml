manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: urob
      url-base: https://github.com/urob
    - name: littorio
      url-base: https://github.com/littorio
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3
      import: app/west.yml
    - name: zmk-adaptive-key
      remote: urob
      revision: v0.3
    - name: zmk-helpers
      remote: urob
      revision: main
    - name: zmk-orbita-layout
      remote: littorio
      revision: main
  self:
    path: config
